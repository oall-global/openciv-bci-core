<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">相对基线：先看分子，再看分母</title><desc id="desc">示意图 · 非实测数据</desc><rect width="720" height="360" rx="16" fill="#111715"/><g font-family="Microsoft YaHei UI, sans-serif"><text x="28" y="35" font-size="21" fill="#e6eeea" text-anchor="start">相对基线：先看分子，再看分母</text><text x="28" y="59" font-size="12" fill="#9aa9a2" text-anchor="start">示意图 · 非实测数据</text><path d="M65,269 L435,269" stroke="#53665d" fill="none" stroke-width="1.5"/><rect x="100" y="189" width="70" height="80" rx="3" fill="#32a0a5" stroke="none"/><text x="135" y="295" font-size="14" fill="#e6eeea" text-anchor="middle">基线</text><text x="135" y="174" font-size="15" fill="#e6eeea" text-anchor="middle">10</text><rect x="225" y="109" width="70" height="160" rx="3" fill="#f0aa3c" stroke="none"/><text x="260" y="295" font-size="14" fill="#e6eeea" text-anchor="middle">当前 A</text><text x="260" y="94" font-size="15" fill="#e6eeea" text-anchor="middle">20</text><rect x="350" y="229" width="70" height="40" rx="3" fill="#5fd3a4" stroke="none"/><text x="385" y="295" font-size="14" fill="#e6eeea" text-anchor="middle">当前 B</text><text x="385" y="214" font-size="15" fill="#e6eeea" text-anchor="middle">5</text><text x="65" y="87" font-size="14" fill="#9aa9a2" text-anchor="start">功率示例（µV²）</text><text x="485" y="135" font-size="19" fill="#f0aa3c" text-anchor="start">20 ÷ 10 = 2×</text><text x="485" y="180" font-size="19" fill="#5fd3a4" text-anchor="start">5 ÷ 10 = 0.5×</text><text x="485" y="225" font-size="13" fill="#e6eeea" text-anchor="start">比较同一通道、频段</text><text x="485" y="250" font-size="13" fill="#e6eeea" text-anchor="start">与相同算法的指标</text><rect x="70" y="321" width="145" height="8" rx="0" fill="#164247" stroke="none"/><rect x="215" y="321" width="145" height="8" rx="0" fill="#32a0a5" stroke="none"/><rect x="360" y="321" width="145" height="8" rx="0" fill="#f0aa3c" stroke="none"/><rect x="50