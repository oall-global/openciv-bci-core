<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">电极皮肤界面不是单纯电阻</title><desc id="desc">示意图 · 非实测数据</desc><rect width="720" height="360" rx="16" fill="#111715"/><g font-family="Microsoft YaHei UI, sans-serif"><text x="28" y="35" font-size="21" fill="#e6eeea" text-anchor="start">电极皮肤界面不是单纯电阻</text><text x="28" y="59" font-size="12" fill="#9aa9a2" text-anchor="start">示意图 · 非实测数据</text><text x="28" y="105" font-size="16" fill="#e6eeea" text-anchor="start">接触界面（简化）</text><path d="M52,190 L128,190" stroke="#53665d" fill="none" stroke-width="1.5"/><path d="M128,145 L128,235" stroke="#53665d" fill="none" stroke-width="1.5"/><path d="M128,145 L180,145" stroke="#53665d" fill="none" stroke-width="1.5"/><rect x="180" y="133" width="88" height="24" rx="0" fill="none" stroke="#f0aa3c"/><path d="M268,145 L327,145" stroke="#53665d" fill="none" stroke-width="1.5"/><path d="M327,145 L327,235" stroke="#53665d" fill="none" stroke-width="1.5"/><path d="M128,235 L209,235" stroke="#53665d" fill="none" stroke-width="1.5"/><path d="M209,215 L209,255" stroke="#32a0a5" fill="none" stroke-width="1.5"/><path d="M227,215 L227,255" stroke="#32a0a5" fill="none" stroke-width="1.5"/><path d="M227,235 L327,235" stroke="#53665d" fill="none" stroke-width="1.5"/><path d="M327,190 L381,190" stroke="#53665d" fill="none" stroke-width="1.5"/><text x="220" y="121" font-size="15" fill="#f0aa3c" text-anchor="middle">R</text><text x="220" y="280" font-size="15" fill="#32a0a5" text-anchor="middle">C</text><text x="423" y="113" font-size="17" fill="#e6eeea" text-anchor="start">阻抗随测试频率变化</text><text x="423" y="156" font-size="13" fill="#e6eeea" text-anchor="start">湿电极：传统目标约 5–10 kΩ</text><text x="423" y="189" font-size="13" fill="#e6eeea" text-anchor="start">干电极：依放大器与接触而定</text><text x="423" y="230" font-size="14" fill="#f0aa3c" text-anchor="start">软件阈值：750 / 2500 kΩ</text><text x="423" y="263" font-size="13" fill="#9aa9a2" text-anchor="start">不是通用的生理或医疗标准</text><text x="28" y="325" font-size="14" fill="#9aa9a2" text-anchor="start">实际还包含电极偏置、组织与放大器；图中只画接触的一部分</text></g></svg>