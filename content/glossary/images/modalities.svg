<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">时空尺度：不同方式回答不同问题</title><desc id="desc">定性范围示意 · 横轴是生理响应时间尺度，不是设备采样率</desc><rect width="720" height="360" rx="16" fill="#111715"/><g font-family="Microsoft YaHei UI, sans-serif"><text x="28" y="35" font-size="21" fill="#e6eeea" text-anchor="start">时空尺度：不同方式回答不同问题</text><text x="28" y="59" font-size="12" fill="#9aa9a2" text-anchor="start">定性范围示意 · 横轴是生理响应时间尺度，不是设备采样率</text><path d="M95,90 L95,290" stroke="#53665d" fill="none" stroke-width="1.5"/><path d="M95,290 L675,290" stroke="#53665d" fill="none" stroke-width="1.5"/><text x="28" y="101" font-size="12" fill="#e6eeea" text-anchor="start">空间更细</text><text x="28" y="280" font-size="12" fill="#e6eeea" text-anchor="start">更粗</text><text x="95" y="322" font-size="13" fill="#e6eeea" text-anchor="start">快：毫秒级</text><text x="565" y="322" font-size="13" fill="#e6eeea" text-anchor="start">慢：秒级</text><rect x="125" y="105" width="130" height="43" rx="8" fill="#5fd3a428" stroke="#5fd3a4"/><text x="190.0" y="131.5" font-size="16" fill="#5fd3a4" text-anchor="middle">皮层内</text><rect x="150" y="163" width="145" height="48" rx="8" fill="#fff5d228" stroke="#fff5d2"/><text x="222.5" y="192.0" font-size="16" fill="#fff5d2" text-anchor="middle">ECoG</text><rect x="255" y="188" width="160" height="60" rx="8" fill="#32a0a528" stroke="#32a0a5"/><text x="335.0" y="223.0" font-size="16" fill="#32a0a5" text-anchor="middle">MEG</text><rect x="185" y="235" width="190" height="42" rx="8" fill="#f0aa3c28" stroke="#f0aa3c"/><text x="280.0" y="261.0" font-size="16" fill="#f0aa3c" text-anchor="middle">EEG</text><rect x="515" y="135" width="125" height="45" rx="8" fill="#b9a2df28" stroke="#b9a2df"/><text x="577.5" y="162.5" font-size="16" fill="#b9a2df" text-anchor="middle">fMRI</text><rect x="505" y="225" width="145" height="50" rx="8" fill="#5fd3a428" stroke="#5fd3a4"/><text x="577.5" y="255.0" font-size="1