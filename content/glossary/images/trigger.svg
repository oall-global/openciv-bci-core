<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">同一串评分，三种输出方式</title><desc id="desc">示意：保持 1 秒按两窗计数；重复间隔 1 秒仍受全局冷却限制</desc><rect width="720" height="360" rx="16" fill="#111715"/><g font-family="Microsoft YaHei UI, sans-serif"><text x="28" y="35" font-size="21" fill="#e6eeea" text-anchor="start">同一串评分，三种输出方式</text><text x="28" y="59" font-size="12" fill="#9aa9a2" text-anchor="start">示意：保持 1 秒按两窗计数；重复间隔 1 秒仍受全局冷却限制</text><path d="M120,143 L650,143" stroke="#f0aa3c" fill="none" stroke-width="1.5" stroke-dasharray="5 4"/><text x="30" y="147" font-size="12" fill="#f0aa3c" text-anchor="start">阈值 0.6</text><polyline points="120.00,171.00 172.00,132.50 224.00,129.00 276.00,125.50 328.00,124.80 380.00,129.00 432.00,164.00 484.00,131.80 536.00,127.60 588.00,125.50 640.00,164.00" fill="none" stroke="#32a0a5" stroke-width="2" stroke-linejoin="round"/><text x="120" y="96" font-size="12" fill="#e6eeea" text-anchor="start">连续两窗满足 → 进入</text><rect x="224" y="176" width="156" height="14" rx="0" fill="#f0aa3c30" stroke="none"/><text x="238" y="203" font-size="12" fill="#f0aa3c" text-anchor="start">冷却 1.5 秒</text><text x="28" y="231" font-size="13" fill="#e6eeea" text-anchor="start">进入一次</text><path d="M120,227 L650,227" stroke="#53665d" fill="none" stroke-width="1.5"/><text x="28" y="268" font-size="13" fill="#e6eeea" text-anchor="start">保持重复</text><path d="M120,264 L650,264" stroke="#53665d" fill="none" stroke-width="1.5"/><text x="28" y="306" font-size="13" fill="#e6eeea" text-anchor="start">连续值</text><path d="M120,302 L650,302" stroke="#53665d" fill="none" stroke-width="1.5"/><circle cx="224" cy="227" r="5" fill="#f0aa3c" stroke="none"/><circle cx="536" cy="227" r="5" fill="#f0aa3c" stroke="none"/><circle cx="224" cy="264" r="5" fill="#5fd3a4" stroke="none"/><circle cx="380" cy="264" r="5" fill="#5fd3a4" stroke="none"/><circle cx="536" cy="264" r="5" fill="#5fd3a4" stroke="none"/><polyl