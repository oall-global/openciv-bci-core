oke="#32a0a5"/><text x="195.0" y="248" font-size="16" fill="#e6eeea" text-anchor="middle">训练与交叉验证</text><text x="195.0" y="271" font-size="12" fill="#9aa9a2" text-anchor="middle">同一段的窗口始终归到同一组</text><rect x="390" y="220" width="270" height="65" rx="8" fill="#1a2722" stroke="#f0aa3c"/><text x="525.0" y="248" font-size="16" fill="#e6eeea" text-anchor="middle">留出新数据复测</text><text x="525.0" y="271" font-size="12" fill="#9aa9a2" text-anchor="middle">不参与调参或挑选方法</text><text x="360" y="327" font-size="14" fill="#9aa9a2" text-anchor="middle">导出与分享前：检查身份信息、同意范围和接收方</text></g></svg>